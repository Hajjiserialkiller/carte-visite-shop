services:
  db:
    image: postgres:16-alpine
    container_name: cartelier-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: cartelier
      POSTGRES_PASSWORD: cartelier
      POSTGRES_DB: cartelier
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
